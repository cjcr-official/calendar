# Cloudflare Workers static hosting for the Grading Calendar PWA.
#
# There is no server-side code: the app is index.html talking straight to
# Supabase, so this Worker only serves the static files. Deploys automatically
# on every push to `main` once the repo is connected in the Cloudflare dashboard
# (Workers & Pages -> the `grading-calendar` Worker -> Settings -> Builds).
name = "grading-calendar"
compatibility_date = "2025-01-15"

# Serves index.html, sw.js, manifest.json, version.json and the icons.
# See .assetsignore for what is kept out of the bundle.
[assets]
directory = "./"
not_found_handling = "single-page-application"
